name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Create the GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag matches the packaged version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          packaged="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$TAG_NAME" != "v${packaged}" ]; then
            echo "::error::tag $TAG_NAME does not match pyproject version $packaged"
            exit 1
          fi
          echo "tag $TAG_NAME matches version $packaged"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
