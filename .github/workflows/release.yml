name: Release

# release-please keeps a release PR open with the next version and changelog. Merging that PR
# creates the tag and the GitHub release. See RELEASING.md.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Update the release PR, or create the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release
      pull-requests: write # open and update the release PR

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # CI does not run on a PR that the default token opens. The Cloudsmith Bot token fixes that.
          token: ${{ secrets.CLOUDSMITH_BOT_PR_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
