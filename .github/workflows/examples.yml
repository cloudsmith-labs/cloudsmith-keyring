name: Examples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_PREFERENCE: only-system
  CLOUDSMITH_ORG: iduffy-demo
  CLOUDSMITH_REPO: cloudsmith-keyring
  # Authenticates the `cloudsmith` CLI via GitHub's OIDC token, exchanged for
  # a short-lived Cloudsmith API key — no stored secret. Requires the
  # `id-token: write` permission granted per job below, and a Cloudsmith
  # service account configured to trust this repository's OIDC claims.
  CLOUDSMITH_SERVICE_SLUG: cloudsmith-keyring
  # Temporary: `domains list`, which this backend needs to confirm a host is
  # Cloudsmith-served, has not shipped in a cloudsmith-cli release yet. Track
  # https://github.com/cloudsmith-io/cloudsmith-cli/tree/custom-domains and
  # drop this pin for a released version once it lands.
  CLOUDSMITH_CLI_REQUIREMENT: git+https://github.com/cloudsmith-io/cloudsmith-cli.git@custom-domains

jobs:
  twine:
    name: twine (upload)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for a Cloudsmith token via OIDC (see the env block above)
    outputs:
      version: ${{ steps.publish.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install cloudsmith-keyring and the example's build/upload tools
        run: |
          mise exec -- uv sync --locked --group dev
          mise exec -- uv pip install "$CLOUDSMITH_CLI_REQUIREMENT" build twine

      # Every run needs a version Cloudsmith hasn't seen: this repository
      # does not support twine's --skip-existing, so re-uploading a version
      # that already exists is a hard failure, not a no-op.
      - name: Build and upload a uniquely-versioned example package
        id: publish
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          version="0.1.${RUN_ID}.${RUN_ATTEMPT}"
          sed -i "s/^version = \"0.1.0\"/version = \"${version}\"/" examples/example-package/pyproject.toml

          mise exec -- uv run python -m build --outdir "$RUNNER_TEMP/dist" examples/example-package
          mise exec -- uv run twine upload --config-file examples/twine/.pypirc -r cloudsmith "$RUNNER_TEMP/dist"/*

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  pip:
    name: pip (install)
    needs: twine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for a Cloudsmith token via OIDC (see the env block above)

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install cloudsmith-keyring, the CLI, and real pip
        run: |
          mise exec -- uv sync --locked --group dev
          mise exec -- uv pip install "$CLOUDSMITH_CLI_REQUIREMENT" pip

      - name: pip install the example package from Cloudsmith
        env:
          EXAMPLE_VERSION: ${{ needs.twine.outputs.version }}
        run: |
          sed "s/^cloudsmith-keyring-example$/cloudsmith-keyring-example==${EXAMPLE_VERSION}/" \
            examples/pip/requirements.txt > "$RUNNER_TEMP/requirements.txt"

          mise exec -- uv run pip install -r "$RUNNER_TEMP/requirements.txt"
          mise exec -- uv run python -c "import cloudsmith_keyring_example as m; print(m.greet())"

  uv:
    name: uv (sync)
    needs: twine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for a Cloudsmith token via OIDC (see the env block above)

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # `uv`'s subprocess keyring provider shells out to a `keyring` on
      # PATH rather than using the project's own venv, so cloudsmith-keyring
      # and the CLI go on this repo's venv, and that venv's bin/ is put on
      # PATH for the sync step below.
      - name: Install cloudsmith-keyring and the CLI
        run: |
          mise exec -- uv sync --locked --group dev
          mise exec -- uv pip install "$CLOUDSMITH_CLI_REQUIREMENT"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: uv sync the example project against Cloudsmith
        env:
          EXAMPLE_VERSION: ${{ needs.twine.outputs.version }}
        run: |
          cp -r examples/uv "$RUNNER_TEMP/uv-example"
          sed -i "s/\"cloudsmith-keyring-example\"/\"cloudsmith-keyring-example==${EXAMPLE_VERSION}\"/" \
            "$RUNNER_TEMP/uv-example/pyproject.toml"

          mise exec -- uv sync --project "$RUNNER_TEMP/uv-example"
          mise exec -- uv run --project "$RUNNER_TEMP/uv-example" \
            python -c "import cloudsmith_keyring_example as m; print(m.greet())"

  pip-tools:
    name: pip-tools (compile)
    needs: twine
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for a Cloudsmith token via OIDC (see the env block above)

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # pip-tools 7.6.0 does not support pip 24.1+ (see examples/pip-tools/README.md).
      - name: Install cloudsmith-keyring, the CLI, and pip-tools
        run: |
          mise exec -- uv sync --locked --group dev
          mise exec -- uv pip install "$CLOUDSMITH_CLI_REQUIREMENT" "pip<24.1" pip-tools

      - name: pip-compile the example requirements against Cloudsmith
        env:
          EXAMPLE_VERSION: ${{ needs.twine.outputs.version }}
        run: |
          sed "s/^cloudsmith-keyring-example$/cloudsmith-keyring-example==${EXAMPLE_VERSION}/" \
            examples/pip-tools/requirements.in > "$RUNNER_TEMP/requirements.in"

          mise exec -- uv run pip-compile -o "$RUNNER_TEMP/requirements.txt" "$RUNNER_TEMP/requirements.in"
          grep "cloudsmith-keyring-example==${EXAMPLE_VERSION}" "$RUNNER_TEMP/requirements.txt"
