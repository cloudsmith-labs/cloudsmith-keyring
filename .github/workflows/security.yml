name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # Catches new zizmor audits and newly-disclosed action vulnerabilities
  # without needing a push.
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read # read the workflow files being audited
      actions: read # resolve the workflows and actions this repo references

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the working tree and history being scanned

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, so it needs all of it, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain with mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # The pre-commit gitleaks hook scans staged content only, which is
      # empty in CI — it would pass without reading a single byte. These
      # scan the working tree and the full history instead.
      - name: Scan the working tree
        run: mise exec -- gitleaks dir --redact --verbose .

      - name: Scan the commit history
        run: mise exec -- gitleaks git --redact --verbose .
