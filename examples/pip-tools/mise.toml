[tools]
python = "3.14"
uv = "latest"

[env]
# Temporary: see ../README.md#prerequisites.
CLOUDSMITH_CLI_REQUIREMENT = "git+https://github.com/cloudsmith-io/cloudsmith-cli.git@custom-domains"

[tasks.install]
description = "Create a throwaway venv with cloudsmith-keyring, the CLI, and pip-tools (needs pip<24.1, see ../README.md)"
run = """
uv venv .venv --clear
uv pip install --python .venv/bin/python -e ../.. keyring "$CLOUDSMITH_CLI_REQUIREMENT" "pip<24.1" pip-tools
"""

[tasks.compile]
description = "pip-compile requirements.in against Cloudsmith (set CLOUDSMITH_WORKSPACE/CLOUDSMITH_REPO to target your own repository, EXAMPLE_VERSION to pin a version)"
depends = ["install"]
run = """
export PATH="$PWD/.venv/bin:$PATH"

src="$(mktemp)"
sed "s#iduffy-demo/cloudsmith-keyring#${CLOUDSMITH_WORKSPACE:-iduffy-demo}/${CLOUDSMITH_REPO:-cloudsmith-keyring}#" requirements.in > "$src"
if [ -n "${EXAMPLE_VERSION:-}" ]; then
  sed -i "s/^cloudsmith-keyring-example$/cloudsmith-keyring-example==${EXAMPLE_VERSION}/" "$src"
fi

pip-compile -o requirements.txt "$src"

if [ -n "${EXAMPLE_VERSION:-}" ]; then
  grep "cloudsmith-keyring-example==${EXAMPLE_VERSION}" requirements.txt
fi
"""
