[tools]
python = "3.14"
uv = "latest"

[env]
CLOUDSMITH_CLI_REQUIREMENT = "cloudsmith-cli>=1.26.0"

[tasks.install]
description = "Create a throwaway venv with cloudsmith-keyring, the CLI, and real pip"
run = """
uv venv .venv --clear
uv pip install --python .venv/bin/python -e ../.. keyring "$CLOUDSMITH_CLI_REQUIREMENT" pip
"""

[tasks.install-example]
description = "pip install the example package from Cloudsmith (set CLOUDSMITH_WORKSPACE/CLOUDSMITH_REPO to target your own repository)"
depends = ["install"]
run = """
export PATH="$PWD/.venv/bin:$PATH"

req="$(mktemp)"
sed "s#iduffy-demo/cloudsmith-keyring#${CLOUDSMITH_WORKSPACE:-iduffy-demo}/${CLOUDSMITH_REPO:-cloudsmith-keyring}#" requirements.txt > "$req"

pip install -r "$req"
python -c "import cloudsmith_keyring_example as m; print(m.greet())"
"""
